aid: peek
name: Peek
description: >-
  Peek is a San Francisco-based travel technology company founded in 2012 by Ruzwana Bashir and Oskar
  Bruening. It operates two connected surfaces: peek.com, a consumer marketplace of 300,000+ bookable
  tours, activities, rentals and attractions, and Peek Pro, the booking and back-office operating system
  used by tour, activity, rental and attraction operators for reservations, capacity and inventory,
  waivers, payments, dynamic pricing and reporting. Its public API surface is the Peek Reseller API — an
  implementation of the OCTO (Open Connectivity for Tourism) open standard for the experiences industry,
  covering products, availability, booking, pricing and booking webhooks — plus a free public remote MCP
  server at mcp.peek.com that gives AI assistants live experience search, detail and availability, and a
  Developer Hub with app SDKs, a CLI and an n8n connector for building apps embedded inside Peek Pro.
