- name: Peek Experiences MCP Server
  description: >-
    A free, public, anonymous remote MCP server that gives AI assistants access to Peek.com's catalog of
    300,000+ verified experiences with real-time availability and pricing. Six tools cover experience
    search with region/category/tag/date/geo filters, experience detail, availability, region search, tag
    listing and an embeddable activity-tile widget. Streamable HTTP transport; no authentication required.
  humanURL: https://peek.com/mcp
  baseURL: https://mcp.peek.com
