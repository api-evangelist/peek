gaps:
- >-
  There is NO published client library for the Peek Reseller API (OCTO) in any registry. Every first-party
  package targets the Peek app platform (GraphQL gateway / app scaffolding), not the OCTO REST surface.
  Resellers implement OCTO directly against https://octo.peek.com/integrations/octo.
