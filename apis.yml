apis:
- name: Peek Reseller API (OCTO)
  description: >-
    Peek Pro's implementation of the OCTO API specification, the open API standard for the experiences
    industry. Resellers list a supplier's products, check the availability calendar and per-departure
    availability, reserve and confirm bookings with QR-coded vouchers, update, extend, cancel and look up
    bookings, and register booking webhooks. Two optional OCTO capabilities are implemented — octo/pricing
    and octo/webhooks. Access is by an OCTO API Key issued by Peek on request.
  humanURL: https://octodocs.peek.com/
  baseURL: https://octo.peek.com/integrations/octo
  tags:
