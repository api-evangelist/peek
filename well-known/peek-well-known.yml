notes:
- >-
  www.peekpro.com/.well-known/security.txt is a real RFC 9116 document (147 bytes, text/plain) and is the
  only .well-known hit anywhere on Peek's estate. Saved verbatim as peek-security.txt.
- >-
  octo.peek.com answers unknown paths with a JSON:API 404 envelope
  ({"jsonapi":{"version":"1.0"},"errors":[{"detail":"Not found","status":"404"}]}), so its negatives are
  genuine 404s rather than a catch-all 200.
- >-
  mcp.peek.com is an MCP transport, not a web server: every GET returns HTTP 406 with JSON-RPC error
  -32600 "Accept header must include text/event-stream". It cannot serve .well-known documents, so the
  MCP server publishes no OAuth metadata — consistent with it being an unauthenticated public server.
- >-
  developers.peek.com, docs.peek.com and developer.peek.com all return HTTP 200 with an identical
  23,049-byte "Peek Pro in Maintenance" HTML page — a wildcard catch-all, NOT a docs host. They are not
  treated as surfaces. api.peek.com returns a 67-byte unrelated text body on every path.
